services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mosi
      POSTGRES_USER: mosi
      POSTGRES_PASSWORD: mosi_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosi"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://mosi:mosi_dev@db:5432/mosi
      JWT_SECRET: dev-secret-change-in-production
      JWT_ALGORITHM: HS256
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
